name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  shared:
    name: shared · typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @solupaes/shared typecheck
      - run: pnpm --filter @solupaes/shared test

  api:
    name: api · typecheck + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solupaes_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/solupaes_test?schema=public
      JWT_SECRET: ci-jwt-secret-very-long-string-padding-for-min-length-here-ok
      REFRESH_SECRET: ci-refresh-secret-very-long-string-padding-for-min-length-here-yes
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @solupaes/api db:generate
      - run: pnpm --filter @solupaes/api typecheck
      - run: pnpm --filter @solupaes/api test

  web:
    name: web · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @solupaes/api db:generate
      - run: pnpm --filter @solupaes/web typecheck
      - run: pnpm --filter @solupaes/web build
        env:
          VITE_API_URL: https://api.example.com
